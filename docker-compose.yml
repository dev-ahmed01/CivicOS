name: civicos

services:
  postgis:
    image: postgis/postgis:17-3.5
    container_name: civicos-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-civicos}
      POSTGRES_USER: ${DATABASE_USERNAME:-civicos}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - civicos_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USERNAME:-civicos} -d ${DATABASE_NAME:-civicos}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  civicos_postgis_data:
    name: civicos-postgis-data
