spring:
  application:
    name: civicos
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/civicos}
    username: ${DATABASE_USERNAME:civicos}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MINIMUM_IDLE:2}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:30000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:20MB}
      max-request-size: ${MAX_UPLOAD_SIZE:20MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  application:
    name: CivicOS
    description: Cross-agency road-work coordination and lifecycle verification

civicos:
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    refresh-expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:14}
    issuer: ${JWT_ISSUER:civicos}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:mock}
    model: ${AI_MODEL:}
    api-key: ${AI_API_KEY:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
  file-storage:
    path: ${FILE_STORAGE_PATH:./data/uploads}
    max-upload-size: ${MAX_UPLOAD_SIZE:20MB}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  features:
    citizen-reporting-enabled: ${CITIZEN_REPORTING_ENABLED:true}
    demo-mode: ${DEMO_MODE:false}
  conflict:
    proximity-meters: ${CONFLICT_PROXIMITY_METERS:0}
    repeat-digging-window-days: ${CONFLICT_REPEAT_DIGGING_WINDOW_DAYS:30}
    multi-agency-minimum: ${CONFLICT_MULTI_AGENCY_MINIMUM:3}
  approval:
    required-evidence-types: ${APPROVAL_REQUIRED_EVIDENCE_TYPES:}
  sla:
    business-zone: ${SLA_BUSINESS_ZONE:Asia/Kolkata}
    business-day-start: ${SLA_BUSINESS_DAY_START:09:00}
    business-day-end: ${SLA_BUSINESS_DAY_END:18:00}
    holidays: ${SLA_HOLIDAYS:}
    at-risk-before-hours: ${SLA_AT_RISK_BEFORE_HOURS:4}
    review-working-hours: ${SLA_REVIEW_WORKING_HOURS:9}
    coordination-medium-working-hours: ${SLA_COORDINATION_MEDIUM_WORKING_HOURS:18}
    coordination-high-working-hours: ${SLA_COORDINATION_HIGH_WORKING_HOURS:9}
    coordination-critical-working-hours: ${SLA_COORDINATION_CRITICAL_WORKING_HOURS:4}
    approval-working-hours: ${SLA_APPROVAL_WORKING_HOURS:9}
    pre-work-working-hours: ${SLA_PRE_WORK_WORKING_HOURS:9}
    execution-working-hours: ${SLA_EXECUTION_WORKING_HOURS:9}
    evidence-working-hours: ${SLA_EVIDENCE_WORKING_HOURS:9}
    verification-working-hours: ${SLA_VERIFICATION_WORKING_HOURS:9}
    correction-working-hours: ${SLA_CORRECTION_WORKING_HOURS:18}
    closure-working-hours: ${SLA_CLOSURE_WORKING_HOURS:9}
    monitor-enabled: ${SLA_MONITOR_ENABLED:true}
    monitor-interval-ms: ${SLA_MONITOR_INTERVAL_MS:60000}
